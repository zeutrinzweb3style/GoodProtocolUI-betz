name: Deploy to Vercel (prebuilt)

# Vercel's Hobby build machine is 2 vCPU / 8 GB and this app needs ~7 GB to
# build, so `yarn build` is killed inside the container. A public repository
# gets a 4 vCPU / 16 GB GitHub-hosted runner for free, so the bundle is built
# here and only the prebuilt output is uploaded to Vercel.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       https://vercel.com/account/tokens
#   VERCEL_ORG_ID      from `vercel link` -> .vercel/project.json
#   VERCEL_PROJECT_ID  from `vercel link` -> .vercel/project.json

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check deploy secrets
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions. See docs/VERCEL_ENV.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Enable the repository's yarn version
        run: corepack enable

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings and environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build the production bundle
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt output
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to production"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
